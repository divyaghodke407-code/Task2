<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="logo">✓ TaskFlow</div>
            <p>Organize your day, achieve your goals.</p>
        </header>

        <main class="todo-card">

            <div class="heading">
                <div>
                    <h1>My Tasks</h1>
                    <p id="taskCount">0 tasks remaining</p>
                </div>

                <span class="date" id="currentDate"></span>
            </div>

            <form id="todoForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    required
                >

                <button type="submit" class="add-btn">+ Add</button>
            </form>

            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">
                    Completed
                </button>
            </div>

            <div id="taskList"></div>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📝</div>
                <h3>No tasks yet!</h3>
                <p>Add your first task to get started.</p>
            </div>

            <div class="bottom">
                <span id="completedCount">0 completed</span>
                <button id="clearCompleted">Clear completed</button>
            </div>

        </main>

        <footer>
            Made with ❤️ | TaskFlow To-Do App
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
